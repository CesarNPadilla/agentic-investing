[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-investing"
version = "0.1.0"
description = "Broker-neutral, research-only investing foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tzdata>=2025.1", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
webull = ["python-dotenv>=1,<2", "webull-openapi-python-sdk>=3.0.2,<4"]

[tool.setuptools.packages.find]
include = ["api*", "agents*", "market_data*", "portfolio*", "fundamentals*", "technical*", "news*", "risk*", "reports*", "database*", "workers*", "scheduler*", "integrations*", "simulation*", "trading*", "strategies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
